name: Weekly Plugin Check

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g @anthropic-ai/claude-code@latest

      - run: claude --version

      - run: claude plugin validate .

      - run: claude plugin test .

      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toLocaleDateString();
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Plugin check failed - ${date}`,
              body: `Weekly plugin validation failed.\n\n[View run](${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
